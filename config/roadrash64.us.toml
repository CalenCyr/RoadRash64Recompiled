    # Stock two-to-four-player races render one viewport for every connected
    # N64 controller. Direct-connect peers must instead retain every remote
    # controller stream for simulation while drawing only the local network
    # slot in a full-screen viewport. The first hook selects the one-player
    # geometry layout; the remaining hooks redirect the single render pass to
    # the peer's assigned player camera and restore that player index after the
    # geometry helper writes viewport zero. Replicated-rider sessions keep the
    # local rider in guest viewport zero; original local multiplayer bypasses
    # all four hooks.
