# N64Recomp bootstrap configuration for Road Rash 64 (USA v1.0).
#
# IMPORTANT (symbols-file mode): current upstream N64Recomp automatically
# recognizes and renames its built-in libultra ignored/reimplemented symbols
# before it applies this config's [patches] lists. Do not duplicate those
# built-in names here (for example __osExceptionPreamble or __osException),
# because their effective names have already become *_recomp at that point.

[input]
entrypoint = 0x80000400
output_func_path = "../build/RecompiledFuncs"
symbols_file_path = "../symbols/roadrash64.us.syms.bootstrap.toml"
rom_file_path = "../build/roadrash64.us.z64"
functions_per_output_file = 50
uses_mips3_float_mode = false
unpaired_lo16_warnings = true
recomp_include = """#include "recomp.h"
#include "rr64_native.hpp"
"""

[patches]
stubs = [
    # Multiplayer forced catch-up only. The sole caller at 8006B128 gates
    # this on >=2 players and human racers. It moves a trailing racer near
    # the leader and charges a penalty. Keep ordinary recovery (8003FE48)
    # and the shared relocation helper (80068E20) intact.
    "func_8003FD60",

    # Early boot cache sweeps. Native host memory is coherent; these N64 CACHE
    # instructions have no host-side work to perform.
    "func_800097EC",
    "func_80009808",

    # Early boot exception/debug path. The exception body is replaced and the
    # register-dump helper contains broad CP0 reads that are unreachable once
    # that body is stubbed.
    "__osException_8000983C",
    "func_80009C50",
]
ignored = [
    # This split tail is Road-Rash-specific and is NOT one of N64Recomp's
    # built-in libultra symbol names, so it remains explicit here.
    "__osExceptionTail_80089A78",
]
renamed = []

# Temporary, low-volume startup breadcrumbs. Each label is emitted only once
# by the native helper, allowing a black-screen run to identify the exact guest
# initialization call that did not return.
hook = [
    { func = "func_8003FE48", text = "rr64_restore_manual_eject_health(rdram, ctx->r4); if (rr64_local_player_roaming(rdram, ctx->r4) || rr64_custom_cop_roaming(rdram, ctx->r4)) return;" },
    { func = "func_8003FE48", before_vram = 0x80040278, text = "if (rr64_custom_cop_can_recover(rdram, ctx->r17)) ctx->r2 = 1;" },
    # Preserve the selected bike's normal health in custom rules, not stock cop-mode health.
    { func = "func_8003EF78", before_vram = 0x8003F024, text = "if (rr64_custom_cop_active()) { ctx->f0.u32l = MEM_W(0x4FC, ctx->r16); goto L_8003F054; }" },
    { func = "func_800645E4", before_vram = 0x80064AB8, text = "if (rr64_custom_cop_trick(rdram, ctx->r23)) ctx->r3 = 0;" },
    { func = "func_800576D4", before_vram = 0x8005778C, text = "if (rr64_custom_cop_siren(rdram, ctx->r16) == 1) MEM_W(0x18, ctx->r29) = 0x42FE0000;" },
    { func = "func_8004090C", text = "rr64_custom_cop_control(rdram, ctx);" },
    { func = "func_80030220", before_vram = 0x800342C4, text = "rr64_custom_cop_hud(rdram, ctx);" },
    # Human police reuse roadside placement and stock sound paths, not AI input.
    { func = "func_8006CF60", before_vram = 0x8006D890, text = "rr64_custom_cop_post(rdram, ctx, ctx->r21);" },
    { func = "func_800576D4", text = "if (rr64_custom_cop_siren(rdram, ctx->r4) == 0) return;" },
    { func = "func_800576D4", before_vram = 0x80057720, text = "if (rr64_custom_cop_siren(rdram, ctx->r16) == 1) ctx->r4 = 1;" },
    { func = "func_80057860", text = "if (rr64_custom_cop_pursuit(rdram, ctx->r4) >= 0) return;" },

    # Hide off-route/wrong-way HUD guidance in every mode, preserving the
    # normal upcoming-turn branch and all underlying route state.
    { func = "func_8006A460", before_vram = 0x8006A4D4, text = "goto L_8006A5E4;" },
    { func = "func_8006A460", before_vram = 0x8006A4F8, text = "goto L_8006A5E4;" },
