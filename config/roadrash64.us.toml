    { func = "func_800636B0", text = "unsigned rr64_stats = ctx->r4, rr64_event = ctx->r5, rr64_name = ctx->r6; rr64_achievement_game_event(rdram, ctx->r5, ctx->r6, ctx->r7);" },

    # Name entry uses a free-moving analog cursor in the original game. Snap
    # each fresh D-pad/stick direction to exactly one grid cell, then apply a
    # deliberate held-direction repeat. This keeps the original screen and
    # pixel-art A/B prompts intact while making quick taps reliable.
    { func = "func_8002B7A8", text = "rr64_name_entry_navigation(rdram, 8, 4);" },

    # The stock menu footer draws its B and A faces from isolated two-byte
    # strings. Refresh only those glyphs from the active profile before layout
    # and drawing; labels, colors, positioning, and all surrounding menu memory
    # remain owned by the original renderer.
    { func = "func_8002F364", text = "rr64_write_button_prompt(rdram, RR64_PROMPT_BUTTON_B, 0x80003B6C, 2); rr64_write_button_prompt(rdram, RR64_PROMPT_BUTTON_A, 0x800025F8, 2);" },

    # Big Game promotion is committed in two authoritative guest paths: race
    # results (when the required bike is already owned), and the bike shop
    # (when the required races are already qualified). Hook immediately after
    # the save call in each path so loading an existing profile cannot produce
    # a false unlock. Level-five completion has its own terminal branch.
    { func = "func_80073054", before_vram = 0x800733AC, text = "rr64_achievement_campaign_level_advanced(rdram, MEM_W(0x6A7C, S32(0x800D << 16)));" },
    { func = "func_8002CD60", before_vram = 0x8002DB6C, text = "rr64_achievement_campaign_level_advanced(rdram, MEM_W(0x6A7C, S32(0x800D << 16)));" },
    { func = "func_80073054", before_vram = 0x80073374, text = "rr64_achievement_campaign_completed(rdram);" },

    # func_80061224 is entered only after the stock bike/rider collision path
    # accepts an impact. Pulse every involved local port at that boundary so
    # weapon hits feel immediate for both the attacker and victim; the game's
    # original wheelie/crash Rumble Pak events remain intact.
    { func = "func_80061224", text = "rr64_combat_impact_rumble(rdram, ctx->r4, ctx->r5, 100);" },

    # The game preallocates fourteen bike records (0x868 bytes each) and
    # fourteen rider records (0x5F0 bytes each). When a replicated online
    # session exceeds the four N64 controller ports, retain the session's
    # connected rider count as setup converges before the native initialization
    # loops consume it. Offline and original local multiplayer are untouched.
    # The surrounding hooks also detect the stock setup stage boundary: the
    # host owns game/race settings through stages 0-1, then every peer regains
    # its assigned input when the stock character/bike stage (2) begins.
    { func = "func_80058DBC", before_vram = 0x80058F60, text = "ctx->r17 = rr64_music_volume_update(ctx->r17, ctx->r16);" },
    { func = "func_80058DBC", before_vram = 0x80058F80, text = "ctx->r5 = rr64_music_stock_volume(ctx->r5);" },
    { func = "func_8005AEE0", before_vram = 0x8005B290, text = "if (ctx->f2.fl >= ctx->f0.fl) rr64_lod_shadow_finish_hold(rdram, ctx);" },
    { func = "func_80027A90", text = "rr64_online_game_setup_before_update(rdram); rr64_local_options_menu_begin(rdram);" },
    # Local race options use the original menu records and renderer. A private
    # nine-row table adds Bike Level without overwriting the stock sentinel.
    # Navigation skips each mode's hidden rows; online retains the stock path.
    { func = "func_80027A90", before_vram = 0x800285C4, text = "if (rr64_local_options_input(rdram)) goto L_8002883C;" },
    { func = "func_80027A90", before_vram = 0x80028F0C, text = "{ int row = rr64_local_options_navigation(rdram); if (row >= 0) { ctx->r2 = row; goto rr64_local_navigation_done; } }" },
