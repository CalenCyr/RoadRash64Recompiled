# Road Rash 64's task-type-2 audio microcode. The input remains the user's
# locally staged ROM; the generated C++ output belongs under ignored build/.
text_offset = 0x0007E890
text_size = 0x00000C60
text_address = 0x00001080
rom_file_path = "../build/roadrash64.us.z64"
output_file_path = "../build/RecompiledFuncs/rr64_audio_rsp.cpp"
output_function_name = "rr64_audio_rsp"

